<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter your report ID</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <link rel="stylesheet" href="new_form.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            min-height: 88vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .heading_text {
            text-transform: capitalize;
            font-size: 2.5rem;
            text-align: center;
            color: rgb(179, 203, 234);
            font-weight: 100;
            margin: 0;
        }

        input[type="text"] {
            min-width: 50vw;
            max-width: 60vw;
            border: none;
            border-radius: 12px;
            text-align: center;
            font-size: 1.8rem;
            color: greenyellow;
            padding: 2rem;
        }

        .form_input_label {
            color: white;
            font-size: 2rem;
            font-weight: 200;
            margin: 2rem 0rem 2rem 0rem;
        }
        .submit_button{
            padding: 1.2rem 2.8rem 1.2rem 2.8rem;
            margin: 0;
            border: none;
            background-color: rgb(14, 166, 0);
            color: white;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 1.4rem;
            font-weight: 200;
        }
        .submit_button:hover{
            background-color: rgb(18, 210, 0);
            transition: all 0.2s ease;
            
        }
    </style>
</head>

<body>
    <!-- Nav bar  -->
    <div class="nav-bar justify-content-between" style="height: 70px; width: 100vw">
        <div class="d-flex align-items-center gap-3">
            <img src="./img/logo.jpeg" />
            <p class="fs-2 text-white" style="font-weight: 200">VRNC</p>
        </div>
        <div class="d-flex">
            <div class="anchor-container">
                <a href="index.html"> Form </a>
            </div>
            <div class="anchor-container">
                <a href="dashboard.html"> Dashboard </a>
            </div>
            <div class="anchor-container">
                <a href="new_form.html"> Form 2 </a>
            </div>
            <div class="anchor-container">
                <a style="margin-right: 1rem" href="new_dashboard.html">
                    Dashboard 2
                </a>
            </div>
        </div>
    </div>
    <div class="container">
        <p class="heading_text">Check your inbox for the Form Id<br /> You should have received it along with other
            details
        </p>
        <label class="form_input_label" for="form_id">
            Enter Form ID
        </label>
        <input id="formId" type="text">
        
        <br>
        <button class="submit_button" onclick="submitForm()">Done</button>
        <script>
            function submitForm() {
              const formId = document.getElementById('formId').value;
        
              // Use localStorage api to store the formId temporarily
              localStorage.setItem('formId', formId);
        
              // Redirect to new_report.html
              window.location.href = 'new_dashboard.html';
            }
        </script>
    </div>
</body>

</html>
