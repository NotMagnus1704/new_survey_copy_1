<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Dashboard</title>
    <link rel="stylesheet" href="new_dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiro Gurmukhi:wght@200;300;400;500&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
    <style>
        body {
            overflow-y: scroll;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0;
            padding: 0 2rem 0 2rem;
        }

        .outer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100vw;
        }

        .medium_text {
            text-align: center;
            font-size: 3rem;
            margin: 2rem 0 2rem 0;
            color: azure;
            font-weight: 200;
        }

        .form-container2 {
            display: flex;
            flex-direction: column;
            color: white;
            min-width: 44rem;
            max-width: 46rem;
            margin: 3rem auto;
            padding: 2rem;
            border-radius: 15px;
            transition: all 0.4s ease;
            border: none;
            background-color: #00000062;
            font-size: 1.3rem;
            border: 2px solid #ffffff00;
            box-shadow: 2px 2px 20px 1px rgba(2, 2, 2, 0.349);
            box-sizing: border-box;
        }


        .form-container2:hover {
            transition: all 0.4s ease;
            background-color: #1f1f1f6c;
            border: 2px solid #dfdfdf57;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .view-button {
            font-size: 1rem;
            padding: 0.8rem;
            background-color: rgb(16, 100, 209);
            border: 1px solid rgb(16, 100, 209);
            transition: all 0.3s ease;
            border-radius: 10px;
            color: #fff;
        }

        .view-button:hover {
            background-color: rgb(68, 149, 255);
            border: 1px solid rgb(68, 149, 255);
            transition: all 0.3s ease;

        }

        .delete-button {
            font-size: 1rem;
            padding: 0.8rem;
            border: none;
            background-color: rgb(193, 15, 15);
            border: 1px solid rgb(193, 15, 15);
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #fff;
        }

        .delete-button:hover {
            transition: all 0.3s ease;
            border: 1px solid rgb(255, 0, 0);
            background-color: rgb(255, 0, 0);
        }

        .generate-button {
            font-size: 1rem;
            padding: 0.8rem;
            background-color: rgb(0, 170, 23);
            border: 1px solid rgb(0, 170, 23);
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #fff;
        }

        .generate-button:hover {
            transition: all 0.3s ease;
            border: 1px solid rgb(0, 222, 30);
            background-color: rgb(0, 222, 30);

        }

        p span {
            float: right;
        }

        p strong {
            color: rgb(216, 216, 216);
        }

        .form-container2 p {
            margin-bottom: 1.5rem;
        }



        .sort-button-div {
            min-width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .sort-button {
            font-size: 1rem;
            background-color: #7b7b7b9c;
            border: 1px solid #7b7b7b9c;
            transition: all 0.3s ease;
            border-radius: 10px;
            color: #fff;
            margin: 0 1rem 0 1rem;
            padding: 0.4rem;
            
        }
        
        .sort-button:hover{
            transition: all 0.3s ease;
            background-color: #9191919c;
            border: 1px solid #f5deb3;
        }

        .search-button{
            width: 10rem;
            font-size: 1.2rem;
            background-color: rgb(16, 100, 209);
            border: 1px solid rgb(16, 100, 209);
            transition: all 0.3s ease;
            border-radius: 10px;
            color: #fff;
            margin: 0 1rem 0 1rem;
            padding: 1rem;
        }
        
        .search-button:hover{
            background-color: rgb(27, 119, 240);
            border: 1px solid rgb(27, 119, 240);
            transition: all 0.3s ease;
        }

        #search_result_text{
            text-align: center;
            font-size: 2rem;
            margin: 2rem 0 0 0;
            color: azure;
            font-weight: 200;
        }

        #search_result_display_text{
            text-align: center;
            font-size: 1.5rem;
            margin: 2rem 0 1rem 0;
            color: azure;
            font-weight: 200;
        }
        

        #searchInput {
            border: 2px solid rgba(0, 0, 0, 0);
            background-color: #abaaaa72;
            text-align: center;
            margin: 0 2rem 0 4rem;
            border-radius: 12px;
            padding: 2rem;
            font-size: 1.5rem;
            color: white;
            transition: all 0.3s ease;
        }
        
        #searchInput::placeholder {
            color: rgb(164, 164, 164);
        }
        
        #searchInput:focus {
            outline: none !important;
            box-shadow: none;
            border: 2px solid rgba(0, 255, 242, 0.685);
            transition: all 0.3s ease;
            background-color: #3838385e;
        }
        
        #searchInput:hover {
            transition: all 0.3s ease;
            background-color: #2424245e;
            border: 2px solid rgb(106, 106, 106);
        }

        @media (max-width: 916px) {
            .form-container2 {
                flex: 1 1 calc(50% - 1rem);
                min-width: 70vw;
                font-size: 1rem;
                padding: 1rem;
            }
            .form-details.open {
                max-width: 800px;
            }
            .search-button{
                width: 5rem !important;
            }

            .medium_text{
                font-size: 2.3rem;
            }

            .sort-button-div{
                margin-bottom: 15px;
            }

            #search_result_text{
                margin: 0;
                font-size: 1.5rem;
            }

            #searchInput {
                margin: 10px !important;
                border-radius: 8px;
                padding: 15px !important;
                font-size: 20px !important;
            }

            #searchInput::placeholder {
                color: rgb(139, 139, 139);
                font-weight: 300;
            }

            .generate-button,
            .view-button,
            .delete-button,
            .sort-button, 
            .search-button {
                font-size: 14px !important;
                padding: none !important;
                margin: 12px !important;

            }

        }

        .form-details {
            
            font-size: 1.2rem;
            display: none;
            border-top: 1px solid #c2c2c2;
            overflow: hidden;
            transition: all 0.4s ease;
            margin: 1.5rem 0 0 0;
            padding:1rem 0 0 0;
            box-sizing: border-box;
        }
        .form-details.open {
            transition: all 0.4s ease;;
            display: block;
            max-width: 38rem;
        }


        @media (max-width: 576px) {
            .form-container2 {
                flex: 1 1 calc(100% - 1rem);
                font-size: 1rem;
                padding: 1rem;
            }
            .form-details.open {
                max-width: 300px;
            }

            .generate-button,
            .view-button,
            .delete-button,
            .sort-button, 
            .search-button {
                font-size: 12px;
                padding: none;

            }
        }

        
    </style>
</head>

<body>

    <!-- --------------------------------------------- navbar ----------------------------------------------  -->
    <div class="nav-bar justify-content-between" style="height: 70px; width: 100vw">
        <div class="d-flex align-items-center gap-3">
            <img src="./img/logo.jpeg" />
            <p class="text-white mt-3" style="font-weight: 200;font-size: 1.7rem;">VRNC</p>
        </div>
        <div class="d-flex">
            <div class="anchor-container">
                <a href="index.html"> Form </a>
            </div>
            <div class="anchor-container">
                <a href="dashboard.html"> Dashboard </a>
            </div>
            <div class="anchor-container">
                <a href="new_form.html"> Form 2 </a>
            </div>
            <div class="anchor-container">
                <a style="margin-right: 1rem" href="latest_dashboard.html">
                    Dashboard 2
                </a>
            </div>
        </div>
    </div>
    <!-- ---------------------------------------------------------------------------------------------------  -->
    <p class="medium_text">
        Admin Dashboard
    </p>

    <!-- form items go here -->
    <div class="outer-container">
        <div class="sort-button-div">
            <input type="text" id="searchInput" placeholder="Search by facility name" 
            >
            <button class="view-button sort-button" onclick="sortForms('asc')">Sort Oldest First</button>
            <button class="view-button sort-button" onclick="sortForms('desc')">Sort Newest First </button>
        </div>
        <div class="expand-button-div">
            <button type="text" onclick="searchForms()" class="search-button">Search</button>
            <button class="search-button" id="expand-all-button" onclick="expandAll()" style="margin: 1.5rem 1rem 0 1rem;">Expand All</button>
            <button class="search-button" id="collapse-all-button" onclick="collapseAll()" style="margin: 1.5rem 1rem 0 1rem;">Collapse All</button>
        </div>
        <p id="search_result_text">Displaying Newest First</p>
        <p id="search_result_display_text"></p>
        <div class="container">
            <div id="formsBox"></div>
        </div>
    </div>
    <script>
        const port = 3000;
        let allForms = []
        
        const fetchForms = function (sortOrder) {
            fetch(`http://127.0.0.1:${port}/form2/getForms`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => response.json())
                .then(data => {

                    allForms = data.forms;

                    const resultText = document.getElementById('search_result_text');

                    // Sort forms based on form2Id
                    allForms.sort((a, b) => {
                        const idA = a.form2Id;
                        const idB = b.form2Id;

                        if (sortOrder === 'asc') {
                            resultText.innerText="Displaying Oldest First"
                            return idA > idB ? 1 : -1;
                        } else {
                            resultText.innerText="Displaying Newest First"
                            return idA < idB ? 1 : -1;
                        }
                    });

                    sortAndRenderForms(sortOrder);

                })
                .catch(error => console.error('Error fetching forms:', error));
        }

        function searchForms() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const filteredForms = allForms.filter(form => 
                form.questions.facility_name.toLowerCase().includes(searchInput)
            );

            document.getElementById('search_result_display_text').innerText=`${filteredForms.length} result(s)`;
            

            renderForms(filteredForms);
        }
    

        function generateReport(form2Id) {
            // Implement the function to generate a report for the form
            console.log(`Generating report for Form ID: ${form2Id}`);
        }

        function sortForms(sortOrder) {
            sortAndRenderForms(sortOrder);
        }

        function sortAndRenderForms(sortOrder){
            let forms = [...allForms];
            forms.sort((a, b) => {
                const idA = a.form2Id;
                const idB = b.form2Id;

                const resultText = document.getElementById('search_result_text');
                
                if (sortOrder === 'asc') {
                    resultText.innerText="Displaying Oldest First"
                    return idA > idB ? 1 : -1;
                } else {
                    resultText.innerText="Displaying Newest First"
                    return idA < idB ? 1 : -1;
                }
            });

            renderForms(forms);
        }

        function renderForms(forms) {
            const formsBox = document.getElementById('formsBox');

            formsBox.innerHTML = '';

            forms.forEach(form => {
                const formDiv = document.createElement('div');
                formDiv.className = 'form-container2';
                formDiv.id = `form-${form.form2Id}`

                formDiv.innerHTML = `
                    <p ><strong>Form ID</strong> <span>${form.form2Id}</span></p>
                    <p ><strong>Facility Name</strong> <span>${form.questions.facility_name}</span></p>
                    <p ><strong>Email</strong> <span>${form.client_email}</span></p>
                    <p ><strong>Date of Submission</strong> <span>${form.date}</span></p>
                    <p ><strong>Time of Submission</strong> <span>${form.time}</span></p>
                    <div class="button-container">
                        <button id="button-${form.form2Id}" class="view-button" onclick="toggleContents(${form.form2Id})">View Contents</button>
                        <button class="generate-button" onclick="generateReport('${form.form2Id}')">Generate Report</button>
                        <button class="delete-button" onclick="deleteForm(${form.form2Id})">Delete</button>
                    </div>
                    <div class="form-details" id="details-${form.form2Id}">
                        ${Object.entries(form.questions).map(([key, value]) => `<p><strong style="color: #ffffff;font-weight:400">${key}: </strong><span style="color:cyan;float:none;font-weight: 300;">${value}</span></p>`).join('')}
                    </div>
                    `;

                formsBox.appendChild(formDiv);
            });
        }
        
        function toggleContents(form2Id) {
            const detailsDiv = document.getElementById(`details-${form2Id}`);
            detailsDiv.classList.toggle('open');
            const viewContentsButton = document.getElementById(`button-${form2Id}`);
            viewContentsButton.innerText = viewContentsButton.innerText === 'View Contents' ? 'Hide Contents' : 'View Contents';

        }

        function expandAll() {
            allForms.forEach(form => {
                const detailsDiv = document.getElementById(`details-${form.form2Id}`);
                const viewContentsButton = document.getElementById(`button-${form.form2Id}`);
                if (!detailsDiv.classList.contains('open')) {
                    detailsDiv.classList.add('open');
                    viewContentsButton.innerText = 'Hide Contents';
                }
            });
        }

        function collapseAll(){
            allForms.forEach(form => {
                const detailsDiv = document.getElementById(`details-${form.form2Id}`);
                const viewContentsButton = document.getElementById(`button-${form.form2Id}`);
                if(detailsDiv.classList.contains('open')){
                    detailsDiv.classList.remove('open');
                    viewContentsButton.innerHTML = "View Contents";
                }
            })
        }

        function deleteForm(form2Id) {
            const permission = prompt(`\nAre you sure you want to delete this entry?\n\nType "yes" to confirm\n`)
            if(permission === "yes"){
                fetch(`http://127.0.0.1:${port}/form2/deleteForm`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ form2Id })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error); });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log(data.message);
                    fetchForms(); // Refresh the list of forms
                })
                .catch(error => console.error('Error deleting form:', error));
       
            }
            else
            alert("Delete operation not performed!");
            
        }
        

        // latest first
        window.onload = () => fetchForms('desc');
    </script>
</body>

</html>
